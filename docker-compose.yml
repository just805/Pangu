# Windows（Docker Desktop）用户请加 -f docker-compose.windows.yml 启动：
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
# 它把 data/ 换成 named volume（NTFS bind mount 的小文件 I/O 实测慢约
# 两个数量级，流量/证据写入会明显变卡），并放开回连端口映射。
# 详见 docker-compose.windows.yml 头注释与 docs/部署手册.md 的 Windows 章节。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pangu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pangu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 并行查询 / 大排序溢出到共享内存，默认 64M 偏小
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pangu} -d ${POSTGRES_DB:-pangu}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 容器日志只增不减：不封顶迟早写满磁盘（docker system df 还不统计这部分）
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  pangu:
    # 镜像在 GHCR 与 Docker Hub 双源发布；默认走 GHCR（发布工作流必然推送），
    # 需要换源时用 PANGU_IMAGE 覆盖。
    image: ${PANGU_IMAGE:-ghcr.io/just805/pangu}:${PANGU_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PANGU_PG_DSN: postgres://${POSTGRES_USER:-pangu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pangu}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PANGU_LLM_PROVIDER: ${PANGU_LLM_PROVIDER:-}
      PANGU_LLM_MODEL: ${PANGU_LLM_MODEL:-}
      PANGU_LLM_BASE_URL: ${PANGU_LLM_BASE_URL:-}
      PANGU_LLM_PROXY: ${PANGU_LLM_PROXY:-}
      # 时区跟随宿主机（.env 的 TZ，未设则 UTC）：否则任务时间戳 / 报告全是 UTC
      TZ: ${TZ:-UTC}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
      # 回连端口映射(按需放开):容器内 MSF/listener 监听的端口要映射到宿主,
      # agent 才能收到 reverse shell。示例(解除注释并按需改):
      # - "4444-4450:4444-4450"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped
    # 停机宽限：docker stop 默认 10 秒后 SIGKILL，在跑的 worker 这一步直接断掉
    stop_grace_period: 60s
    # 健康检查：start.sh 包装进程活着不等于 pangu 活着（本体反复崩溃时容器状态
    # 仍是 running）。`docker compose ps` 显示 healthy 才是真的起来了。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8787/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # 文件句柄：nuclei/httpx/ffuf 都是句柄大户
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
