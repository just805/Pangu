<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="盘古 Pangu">
  <defs>
    <linearGradient id="pg-sky" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".45" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pg-rift" x1="14" y1="32" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 底：深墨圆角方（混沌未分） -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#0b1120"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#fb923c" stroke-opacity=".22"/>
  <!-- 天穹弧 + 大地弧：开辟后的天地，合起来是混沌之环/洞察之眼 -->
  <path d="M11 33 Q32 7 53 33" fill="none" stroke="url(#pg-sky)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M11 33 Q32 59 53 33" fill="none" stroke="url(#pg-sky)" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
  <!-- 天地分界：一道贯通的光缝（一次性劈开，中央最亮，两端渐隐） -->
  <path d="M15 32 L49 32" fill="none" stroke="url(#pg-rift)" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 核心：盘古之力 / 洞察节点 -->
  <path d="M32 25.5 L36 32 L32 38.5 L28 32 Z" fill="#fff7ed"/>
  <path d="M32 28 L34 32 L32 36 L30 32 Z" fill="#fb923c"/>
  <!-- 清气上升（天）三粒 -->
  <circle cx="24" cy="17" r="1.5" fill="#fbbf24" opacity=".9"/>
  <circle cx="32" cy="13.5" r="1.9" fill="#fbbf24"/>
  <circle cx="40" cy="17" r="1.5" fill="#fbbf24" opacity=".9"/>
  <!-- 浊气下沉（地）三粒 -->
  <circle cx="24" cy="47" r="1.3" fill="#fb923c" opacity=".7"/>
  <circle cx="32" cy="50" r="1.6" fill="#fb923c" opacity=".85"/>
  <circle cx="40" cy="47" r="1.3" fill="#fb923c" opacity=".7"/>
</svg>
