# CI 门禁:构建 + 静态检查 + 全量测试(需要 PostgreSQL,测试基建见 db/testmain_test.go)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pangu
          POSTGRES_PASSWORD: pangu-pass
          POSTGRES_DB: pangu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pangu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PANGU_PG_DSN: postgres://pangu:pangu-pass@localhost:5432/pangu_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -p 1: 连 PG 的测试包不止持有跨包 advisory lock 的 db/agent/server 三个
        # (llmrec/evidence/traffic 等无锁),CI 多核并行时与 agent 包写事务死锁
        # (SQLSTATE 40P01,两轮稳定复现)。串行跑包与 TestMain 的锁设计意图一致。
        # 失败时把紧凑的失败摘要写进 job summary，避免完整日志被 GitHub 截断后
        # 无法定位具体测试（日志下载需要管理员权限）。
        run: |
          set -o pipefail
          go test -p 1 ./... -count=1 2>&1 | tee /tmp/go-test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## Go test failures'
              echo '```'
              grep -E '^(--- FAIL|FAIL[[:space:]]|    [^ ]+_test\.go:[0-9]+:)' /tmp/go-test.log | head -200 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      # lint 暂不进门禁：存量 75 个 error 均为行为级修复（空 catch 补处理、悬浮
      # Promise 补 await、a11y），与最小 diff 原则冲突，留作独立治理任务；
      # build:static 已覆盖 TS 类型检查与静态导出验证。
      - name: Build (static export)
        run: npm run build:static
        working-directory: web
